[package]
name = "fsm-cli"
version = "0.6.3"
edition = "2024"
description = "fsm: a command-line tool for UML state machines (.fsm files). Generates code from them with Jinja templates"
license = "MIT"
repository = "https://github.com/vincedupuis/fsm-cli"
readme = "README.md"
keywords = ["uml", "state-machine", "code-generator", "jinja", "statechart"]
categories = ["command-line-utilities", "development-tools"]
publish = false

# The library: the program's pipeline, and the same pipeline without a file system (see lib.rs). Built as a
# WebAssembly module, a plain cdylib, with
#   cargo rustc --lib --crate-type cdylib --profile wasm --target wasm32-unknown-unknown
# The crate type is given there rather than here: a library built as rlib and cdylib at once gets no LTO.
[lib]
name = "fsm_cli"
path = "src/lib.rs"

[[bin]]
name = "fsm"
path = "src/cli/main.rs"

[dependencies]
minijinja = { version = "3.0.5", features = ["json", "serde", "preserve_order"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The WebAssembly module, optimized for size: about 1.2 MB, against 1.8 MB at opt-level 3 (barely faster) and
# 1.0 MB at "z" (a third slower).
[profile.wasm]
inherits = "release"
opt-level = "s"

[dev-dependencies]
boon = "0.6.1"
