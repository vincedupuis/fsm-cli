[package]
name = "fsm-cli"
version = "0.7.2"
edition = "2024"
description = "fsm: a command-line tool for UML state machines (.fsm files). Generates code from them with Jinja templates"
license = "MIT"
repository = "https://github.com/vincedupuis/fsm-cli"
readme = "README.md"
keywords = ["uml", "state-machine", "code-generator", "jinja", "statechart"]
categories = ["command-line-utilities", "development-tools"]
publish = false

# The library: the program's pipeline, and the same pipeline without a file system (see lib.rs).
[lib]
name = "fsm_cli"
path = "src/lib.rs"

[[bin]]
name = "fsm"
path = "src/cli/main.rs"

[dependencies]
minijinja = { version = "3.0.5", features = ["json", "serde", "preserve_order"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
boon = "0.6.1"
